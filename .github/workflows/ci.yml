name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  # Required for deploy.yml to call this as a reusable gate workflow.
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Lint and build only. deploy.yml calls this as its gate so a push that fails
# the build never reaches the VPS.
jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # dummy values so `next build` can run in CI without real secrets;
      # real secrets live only in the VPS .env
      DATABASE_URL: postgres://tambangan:tambangan@localhost:5432/tambangan
      JWT_SECRET: ci-dummy-jwt-secret-must-be-at-least-32-chars-long
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
