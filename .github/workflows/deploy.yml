# ============================================================
# CI/CD — tambangan
# ============================================================
# Branches:
#   • development → CI only (install → lint → build)
#   • main        → CI + deploy to VPS via SSH + docker compose
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions → New repository secret):
#   VPS_HOST    = 43.129.53.235  (or your VPS IP / hostname)
#   VPS_USER    = ubuntu          (SSH user on VPS)
#   VPS_SSH_KEY = <private key>   (cat ~/.ssh/id_ed25519 — the PRIVATE key, single line with \n preserved)
#   Optional:
#   VPS_PORT    = 22              (defaults to 22 if not set)
#   VPS_PATH    = /home/ubuntu/tambangan  (defaults to /home/ubuntu/tambangan if not set)
#
# VPS one-time setup (run once via SSH):
#   sudo mkdir -p /home/ubuntu/tambangan && sudo chown $USER:$USER /home/ubuntu/tambangan
#   git clone git@github.com:abuamar142/tambangan.git /home/ubuntu/tambangan
#   # or: git clone https://github.com/abuamar142/tambangan.git /home/ubuntu/tambangan
#   cd /home/ubuntu/tambangan && cp .env.example .env  # then fill real secrets
#   # ensure deploy key / GitHub access works for `git pull` (deploy key or HTTPS token)
#
# Local branch setup:
#   git checkout -b development   # first time only
#   git push -u origin development
# ============================================================

name: CI / Deploy

on:
  push:
    branches: [main, development]
  # optional: also run CI on PRs targeting either branch
  pull_request:
    branches: [main, development]
  workflow_dispatch:

# cancel superseded runs on same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # dummy values so `next build` can run in CI without real secrets
      # real secrets are only on the VPS .env, never in GitHub Actions
      DATABASE_URL: postgres://tambangan:tambangan@localhost:5432/tambangan
      JWT_SECRET: ci-dummy-jwt-secret-must-be-at-least-32-chars-long
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # cache-dependency-path ensures pnpm-lock.yaml is respected
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    # only deploy on push to main (not on PR, not on development)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          # optional fingerprint verification — add VPS_HOST_FINGERPRINT secret if you want strict host checking
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.VPS_PATH || '/home/ubuntu/tambangan' }}"
            echo "→ Deploying to $APP_DIR on $(hostname) as $(whoami)"
            cd "$APP_DIR"

            echo "→ Pulling latest main..."
            # ensure we are on main and fast-forward only; adjust if you use a different remote/branch
            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            echo "→ Rebuilding containers..."
            docker compose up -d --build

            echo "→ Running database migrations..."
            npx drizzle-kit migrate || echo "⚠ Migration skipped (may already be applied)"

            echo "→ Waiting for app to be healthy..."
            # wait up to ~60s for app to respond
            for i in $(seq 1 12); do
              if curl -fsS http://127.0.0.1:3000/ > /dev/null; then
                echo "✓ Healthcheck passed (attempt $i)"
                break
              fi
              echo "  ...not ready yet (attempt $i/12), retrying in 5s"
              sleep 5
              if [ "$i" -eq 12 ]; then
                echo "::error::Healthcheck failed after 60s — showing logs:"
                docker compose ps -a || true
                docker compose logs --tail 200 app || true
                exit 1
              fi
            done

            echo "→ Pruning dangling images..."
            docker image prune -f || true

            echo "✓ Deploy complete."
