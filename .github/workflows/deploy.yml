# ============================================================
# CI/CD — tambangan
# ============================================================
# Branches:
#   • development → CI only (install → lint → build)
#   • main        → CI + deploy to VPS via deploy-tambangan.sh
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   VPS_HOST    = 43.129.53.235
#   VPS_USER    = ubuntu
#   VPS_SSH_KEY = <private key>
#   VPS_PORT    = 22 (optional)
# ============================================================

name: CI / Deploy

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgres://tambangan:***@localhost:5432/tambangan
      JWT_SECRET: ci-dummy-jwt-secret-must-be-at-least-32-chars-long
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: /home/ubuntu/deploy-tambangan.sh main
