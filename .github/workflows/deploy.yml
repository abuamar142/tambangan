# ============================================================
# CI/CD — tambangan
# ============================================================
# Branches:
#   • development → CI only (install → lint → build)
#   • main        → CI + deploy to VPS via SSH + docker compose
#
#   VPS_HOST    = 43.129.53.235  (atau IP/hostname VPS)
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   VPS_USER    = ubuntu          (SSH user on VPS)
#   VPS_SSH_KEY = <private key>   (cat ~/.ssh/id_ed25519 — the PRIVATE key, single line with \n preserved)
#   VPS_PORT    = 22              (opsional, default 22)
#
# Pola deploy: SELALU lewat /opt/ops/bin/deploy-tambangan.sh di VPS
# (pull -> bun install -> docker compose prod -> migrate -> health-check).
# Jangan duplikat logika deploy di workflow ini, cukup panggil scriptnya.
# Panduan: /opt/ops/docs/README.md di VPS.
# Setup awal VPS sudah dilakukan 2026-09-15 (repo /opt/tambangan).
#
# Local branch setup:
#   git checkout -b development   # first time only
#   git push -u origin development
# ============================================================

name: CI / Deploy

on:
  push:
    branches: [main, development]
  # optional: also run CI on PRs targeting either branch
  pull_request:
    branches: [main, development]
  workflow_dispatch:

# One deploy per branch. The group MUST differ from ci.yml's: when ci.yml runs
# as the reusable gate, `github.workflow` resolves to this workflow's name, so
# a shared pattern put the gate and its caller in one group — and the gate's
# cancel-in-progress killed the very run that spawned it.
concurrency:
  group: deploy-tambangan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Gate
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: verify
    # Deploy on a push to main, or when someone runs the workflow by hand
    # from the main branch. Development and PRs stop at the gate.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 10
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          # optional fingerprint verification — add VPS_HOST_FINGERPRINT secret if you want strict host checking
          script: |
            set -euo pipefail
            /opt/ops/bin/deploy-tambangan.sh main
