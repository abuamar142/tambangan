# ============================================================
# CI/CD — tambangan
# ============================================================
# Branches:
#   • development → CI only (install → lint → build)
#   • main        → CI + deploy to VPS via SSH + docker compose
#
#   VPS_HOST    = 43.129.53.235  (atau IP/hostname VPS)
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   VPS_USER    = ubuntu          (SSH user on VPS)
#   VPS_SSH_KEY = <private key>   (cat ~/.ssh/id_ed25519 — the PRIVATE key, single line with \n preserved)
#   VPS_PORT    = 22              (opsional, default 22)
#
# Pola deploy: SELALU lewat /opt/ops/bin/deploy-tambangan.sh di VPS
# (pull -> bun install -> docker compose prod -> migrate -> health-check).
# Jangan duplikat logika deploy di workflow ini, cukup panggil scriptnya.
# Panduan: /opt/ops/docs/README.md di VPS.
# Setup awal VPS sudah dilakukan 2026-09-15 (repo /opt/tambangan).
#
# Local branch setup:
#   git checkout -b development   # first time only
#   git push -u origin development
# ============================================================

name: CI / Deploy

on:
  push:
    branches: [main, development]
  # optional: also run CI on PRs targeting either branch
  pull_request:
    branches: [main, development]
  workflow_dispatch:

# cancel superseded runs on same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # dummy values so `next build` can run in CI without real secrets
      # real secrets are only on the VPS .env, never in GitHub Actions
      DATABASE_URL: postgres://tambangan:tambangan@localhost:5432/tambangan
      JWT_SECRET: ci-dummy-jwt-secret-must-be-at-least-32-chars-long
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    # only deploy on push to main (not on PR, not on development)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          # optional fingerprint verification — add VPS_HOST_FINGERPRINT secret if you want strict host checking
          script: |
            set -euo pipefail
            /opt/ops/bin/deploy-tambangan.sh main
