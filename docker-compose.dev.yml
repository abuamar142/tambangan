services:
  app:
    # Override untuk dev environment
    # Jalankan: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER:-tambangan}:${POSTGRES_PASSWORD:-tambangan}@db:5432/${POSTGRES_DB:-tambangan}
    ports:
      - "3002:3000"
    command: bun run dev
    build:
      context: .
      dockerfile: Dockerfile.dev
