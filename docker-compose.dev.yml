# Development override — docker compose --env-file .env -f docker-compose.yml -f docker-compose.dev.yml up -d
services:
  # Dev postgres terisolasi: data di volume pgdata_dev, port host 5433.
  # Credentials SAMA dengan prod (.env) — satu password yang dirotasi,
  # tapi DATABASE berbeda (${POSTGRES_DB}_dev) sehingga data tidak campur.
  db-dev:
    image: postgres:17-alpine
    container_name: tambangan-db-dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}_dev
    ports:
      # Loopback only: nginx reaches this over 127.0.0.1, and a database
      # bound to 0.0.0.0 answers anyone who can reach the VPS.
      - "127.0.0.1:5433:5432"
    volumes:
      - tambangan-pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tambangan} -d ${POSTGRES_DB:-tambangan}_dev"]
      interval: 5s
      timeout: 3s
      retries: 10


  app-dev:
    container_name: tambangan-app-dev
    # restart: sama dengan db-dev dan prod. Tanpa ini container dev tidak ikut
    # hidup lagi setelah VPS reboot, dan domain dev-nya jadi 502 sampai ada
    # yang ingat menjalankannya manual.
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-dev:5432/${POSTGRES_DB}_dev
    depends_on: !reset
      db-dev:
        condition: service_healthy
    ports:
      - "127.0.0.1:3002:3000"
    command: bun run dev
    build:
      context: .
      dockerfile: Dockerfile.dev

volumes:
  tambangan-pgdata-dev:
    name: tambangan-pgdata-dev
