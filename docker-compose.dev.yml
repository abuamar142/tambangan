services:
  # Override db dengan container_name berbeda agar tidak bentrok dengan prod
  db:
    container_name: tambangan-db-dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tambangan}_dev

  app:
    # Override untuk dev environment
    # Jalankan: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
    container_name: tambangan-app-dev
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER:-tambangan}:${POSTGRES_PASSWORD:-tambangan}@db:5432/${POSTGRES_DB:-tambangan}_dev
    ports:
      - "3002:3000"
    # Run migration then start dev server
    command: sh -c "bunx drizzle-kit migrate && bun run dev"
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      - db
