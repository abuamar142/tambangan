# Development override — docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
services:
  db:
    container_name: tambangan-db-dev
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tambangan}_dev

  app:
    container_name: tambangan-app-dev
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://$${POSTGRES_USER:-tambangan}:$${POSTGRES_PASSWORD:-tambangan}@db:5432/$${POSTGRES_DB:-tambangan}_dev
    ports:
      - "3002:3000"
    # Just run dev server; migrations handled separately via deploy script
    command: bun run dev
    build:
      context: .
      dockerfile: Dockerfile.dev
